name: Dependency audit

on:
  push:
    branches: [agent/dependency-cleanup]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Dependency tree
        run: npm ls --all
      - name: Audit
        run: npm audit --json || true
