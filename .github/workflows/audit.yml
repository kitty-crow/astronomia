name: Apply dependency cleanup

on:
  push:
    branches: [agent/dependency-cleanup]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dependency-cleanup
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Update manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          delete pkg.devDependencies.c8
          delete pkg.devDependencies['serialize-to-js']
          delete pkg.devDependencies['serialize-to-module']
          pkg.scripts.coverage = 'rm -rf coverage && NODE_V8_COVERAGE=coverage node --import tsx ./node_modules/mocha/bin/mocha.js "test/**/*.test.ts"'
          pkg.scripts.audit = 'npm audit --audit-level=low'
          pkg.overrides = {
            diff: '8.0.3',
            glob: '13.0.6',
            'serialize-javascript': '7.0.5'
          }
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
      - name: Install without warnings
        run: |
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee install.log
          ! grep -E 'npm warn deprecated|DeprecationWarning' install.log
      - name: Audit
        run: npm run audit
      - name: Validate
        env:
          NODE_OPTIONS: --throw-deprecation
        run: npm run ci
      - name: Commit dependency cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: clean dependency tree"
          git push origin HEAD:agent/dependency-cleanup
