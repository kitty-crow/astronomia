name: Version 5 and resquash

on:
  push:
    branches:
      - agent/strict-typescript-refactor

permissions:
  contents: write

concurrency:
  group: version-5-and-resquash
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/strict-typescript-refactor
          fetch-depth: 0

      - name: Version release and document policy
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))

          if (pkg.version !== '4.2.0' && pkg.version !== '5.0.0') {
            throw new Error(`Unexpected package version: ${pkg.version}`)
          }

          pkg.version = '5.0.0'
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

          python <<'PY'
          from pathlib import Path

          path = Path('docs/development.md')
          text = path.read_text(encoding='utf-8')
          heading = '## Versioning\n'
          section = '''## Versioning

Astronomia follows semantic versioning. Every meaningful project landmark must update `package.json` in the same change:

- **patch** for compatible fixes, documentation corrections and internal changes that do not alter the public contract
- **minor** for backwards-compatible public functionality, modules, exports or substantial capabilities
- **major** for breaking API, runtime, package-format or behavioural changes

Version bumps are cumulative and incremental. Do not reuse or skip backwards over a released version. A release commit, tag and published package must carry the same version.

'''
          if heading not in text:
            marker = '## Commands\n'
            if marker not in text:
              raise SystemExit('development documentation insertion point not found')
            text = text.replace(marker, section + marker)
            path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/version-5-and-resquash.yml
          git add -A

      - name: Validate release state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = '5.0.0'
          grep -q '^## Versioning$' docs/development.md
          test ! -e package-lock.json
          npm install --ignore-scripts --no-package-lock
          npm run ci

      - name: Squash and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft 71e16c942b143a1a5a067b6aab2d8532064704ae
          git commit -m "refactor: release strict TypeScript v5.0.0"
          git push --force-with-lease origin HEAD:agent/strict-typescript-refactor
