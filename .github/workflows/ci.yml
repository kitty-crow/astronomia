name: Apply v5 package version

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-v5-package-version
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/strict-typescript-refactor
          fetch-depth: 0

      - name: Set package version
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.version !== '4.2.0' && pkg.version !== '5.0.0') {
            throw new Error(`Unexpected package version: ${pkg.version}`)
          }
          pkg.version = '5.0.0'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          grep -q '^## Versioning$' docs/development.md

      - name: Validate v5 release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = '5.0.0'
          test ! -e package-lock.json
          npm install --ignore-scripts --no-package-lock
          npm run ci

      - name: Commit package metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          git add package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: version 5.0.0"
          git push origin HEAD:agent/strict-typescript-refactor
