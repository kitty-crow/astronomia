name: Apply v5 release

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-v5-release
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/strict-typescript-refactor
          fetch-depth: 0

      - name: Apply version and restore permanent CI
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.version !== '4.2.0' && pkg.version !== '5.0.0') {
            throw new Error(`Unexpected package version: ${pkg.version}`)
          }
          pkg.version = '5.0.0'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

          grep -q '^## Versioning$' docs/development.md
          rm -f .github/workflows/version-5-and-resquash.yml

          cat > .github/workflows/ci.yml <<'YAML'
          # Validate the strict TypeScript source, generated declarations, package builds and tests.

          name: CI

          on:
            push:
              branches: [ main ]
            pull_request:
              branches: [ main ]
            workflow_dispatch:
              inputs:
                ref:
                  description: Tag or commit SHA to check out
                  required: false

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          env:
            CI: "true"

          jobs:
            build:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  node: [ 22, 24 ]
              name: Node ${{ matrix.node }}
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.inputs.ref || github.ref }}
                - name: Set up Node ${{ matrix.node }}
                  uses: actions/setup-node@v4
                  with:
                    node-version: ${{ matrix.node }}
                - name: Install dependencies
                  run: npm install --ignore-scripts
                - name: Validate
                  run: npm run ci
          YAML

          git add -A

      - name: Validate v5 release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = '5.0.0'
          test ! -e package-lock.json
          npm install --ignore-scripts --no-package-lock
          npm run ci

      - name: Squash and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft 71e16c942b143a1a5a067b6aab2d8532064704ae
          git commit -m "refactor: release strict TypeScript v5.0.0"
          git push --force-with-lease origin HEAD:agent/strict-typescript-refactor
