name: Validate dependency cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate cleaned manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          delete pkg.devDependencies.c8
          delete pkg.devDependencies['serialize-to-js']
          delete pkg.devDependencies['serialize-to-module']
          pkg.scripts.coverage = 'rm -rf coverage && NODE_V8_COVERAGE=coverage node --import tsx ./node_modules/mocha/bin/mocha.js "test/**/*.test.ts"'
          pkg.scripts.audit = 'npm audit --audit-level=low'
          pkg.overrides = {
            diff: '8.0.3',
            glob: '13.0.6',
            'serialize-javascript': '7.0.5'
          }
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
      - name: Install without deprecation warnings
        run: |
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee dependency-install.log
          ! grep -E 'npm warn deprecated|DeprecationWarning' dependency-install.log
      - name: Audit
        run: npm run audit
      - name: Validate
        env:
          NODE_OPTIONS: --throw-deprecation
        run: npm run ci
      - name: Save validated dependency files
        uses: actions/upload-artifact@v5
        with:
          name: dependency-cleanup
          path: |
            package.json
            package-lock.json
            dependency-install.log
