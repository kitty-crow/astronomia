# Validate the strict TypeScript source, generated declarations, package builds and tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit SHA to check out
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install without deprecation warnings
        run: |
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee dependency-install.log
          ! grep -E 'npm warn deprecated|DeprecationWarning' dependency-install.log
      - name: Audit dependencies
        run: npm run audit
      - name: Validate
        env:
          NODE_OPTIONS: --throw-deprecation
        run: npm run ci
